<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي المتصل بـ Supabase</title>
  <!-- استدعاء مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="padding: 20px; font-family: sans-serif; text-align: center; background-color: #f5f5f5;">
  <h1 style="color: #333;">🚀 مرحباً بك في موقعي</h1>
  <button id="testBtn" style="padding: 15px 25px; font-size: 18px; background-color: #3ecf8e; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px;">اختبر الاتصال بقاعدة البيانات</button>
  
  <!-- هذا المربع سيظهر لك الأخطاء أو النجاح بدقة -->
  <div id="result" style="margin-top: 20px; font-size: 16px; color: #333; border: 1px solid #ddd; border-radius: 8px; padding: 15px; background-color: white; text-align: left; display: none;"></div>

  <script>
    // 1. التأكد أن المكتبة تم تحميلها
    if (typeof supabase === 'undefined') {
      document.getElementById('result').style.display = 'block';
      document.getElementById('result').innerText = '❌ خطأ: لم يتم تحميل مكتبة Supabase. تحقق من اتصالك بالإنترنت.';
    } else {
      // 2. إعداد البيانات (لقد وضعتها لك)
      const supabaseUrl = 'https://onddnenwcmorgphifysb.supabase.co';
      const supabaseKey = 'sb_publishable_dKOGf3_BYEtJkeS6sMuW0A_zDqXn0f3';
      const supabaseClient = createClient(supabaseUrl, supabaseKey);

      // 3. التأكد من وجود الزر عند التحميل
      document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('testBtn');
        const resultBox = document.getElementById('result');

        if (!btn) {
          resultBox.style.display = 'block';
          resultBox.innerText = '❌ خطأ: لم أجد الزر في الصفحة!';
          return;
        }

        btn.addEventListener('click', async () => {
          // إظهار مربع النتيجة وجعله يظهر انشغالاً
          resultBox.style.display = 'block';
          resultBox.innerText = '⏳ جاري الاتصال بقاعدة البيانات...';
          btn.disabled = true; // تعطيل الزر لتجنب الضغط المتكرر

          try {
            // محاولة الاتصال بقاعدة بيانات Supabase
            const { data, error } = await supabaseClient.from('users').select('*');

            if (error) {
              // إذا كان هناك خطأ من قاعدة البيانات (مثل سياسات RLS)
              resultBox.innerText = '❌ خطأ من قاعدة البيانات:\n' + error.message;
            } else {
              // إذا نجح الاتصال
              if (data && data.length > 0) {
                resultBox.innerText = '✅ تم الاتصال بنجاح!\nالبيانات الموجودة: ' + JSON.stringify(data);
              } else {
                resultBox.innerText = '✅ تم الاتصال بنجاح!\n(الجدول موجود لكنه فارغ حالياً، أضف بيانات من Supabase وجرب مرة أخرى)';
              }
            }
          } catch (err) {
            // إذا كان هناك خطأ في الكود نفسه (Syntax Error أو غيرها)
            resultBox.innerText = '❌ خطأ تقني في الكود:\n' + err.message;
          } finally {
            btn.disabled = false; // إعادة تفعيل الزر
          }
        });
      });
    }
  </script>
</body>
</html>
